    <style>
        /* --- CSS STYLES --- */
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            margin: 0;
            overflow-x: hidden;
        }

        h1 { font-size: 24px; margin-bottom: 10px; }

        #controls { margin-bottom: 20px; z-index: 10; }

        button {
            padding: 10px 20px; font-size: 16px;
            cursor: pointer; background-color: #e94560; color: white;
            border: none; border-radius: 5px; font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* --- THE FANNED DECK --- */
        #fan-container {
            position: relative;
            width: 100%;
            height: 140px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .fan-card {
            position: absolute;
            width: 70px;
            height: 110px;
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            border: 2px solid #e94560;
            border-radius: 8px;
            bottom: 0;
            left: 50%;
            margin-left: -35px; /* Centers the card */
            transform-origin: bottom center; /* Rotates from the bottom */
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1), opacity 0.3s, bottom 0.2s;
            cursor: pointer;
            box-shadow: -2px 0 5px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        /* Hover effect to raise the card slightly */
        .fan-card:hover {
            bottom: 15px; 
            z-index: 50 !important;
        }

        /* The animation class that stacks them together */
        #fan-container.is-shuffling .fan-card {
            transform: rotate(0deg) translateY(20px) !important;
        }

        /* --- THE 3-CARD SPREAD AREA --- */
        #spread-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            min-height: 160px;
            perspective: 1000px;
        }

        .spread-slot {
            width: 90px;
            height: 140px;
            border: 2px dashed #4a4e69;
            border-radius: 8px;
            position: relative;
        }

        /* The 3D Playable Card inside a slot */
        .card {
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d; cursor: pointer;
            opacity: 0; /* Hidden until a card is picked */
            pointer-events: none;
        }

        .card.is-active { opacity: 1; pointer-events: auto; }
        .card.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); display: flex;
            flex-direction: column; justify-content: center;
            align-items: center; box-sizing: border-box;
        }

        .card-back {
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            border: 2px solid #e94560; font-size: 30px;
        }

        .card-front {
            background-color: #f4f4f4; color: #333;
            transform: rotateY(180deg); overflow: hidden;
            border: 2px solid #fff;
        }

        .card-front img {
            width: 100%; height: 100%; object-fit: cover;
        }
        
        .is-reversed { transform: rotate(180deg); }

        /* --- THE INFORMATION BOX --- */
        #reading-info {
            margin-top: 30px;
            background-color: #24243e;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border-top: 3px solid #e94560;
        }

        #info-title { margin: 0 0 10px 0; color: #e94560; font-size: 20px;}
        #info-text { margin: 0; line-height: 1.5; font-size: 15px;}
        #spread-labels {
            display: flex; justify-content: center; gap: 15px; 
            width: 100%; max-width: 400px; margin-top: 5px;
            font-size: 12px; color: #a9a9a9; font-weight: bold;
        }
        .label { width: 90px; text-align: center; text-transform: uppercase;}

    </style>

        let currentDeck = [];

        const shuffleBtn = document.getElementById("shuffle-btn");
        const infoTitle = document.getElementById("info-title");
        const infoText = document.getElementById("info-text");

        // Function to create the visual fanned deck
        function createFan() {
            fanContainer.innerHTML = ''; // Clear old fan
            // We draw 21 visual cards to represent the deck so it fits on screen nicely
            for (let i = 0; i < 21; i++) {
                let card = document.createElement("div");
                card.className = "fan-card";
                card.innerText = "🔮";
                
                // Math to calculate the curve of the fan (-50 degrees to +50 degrees)
                let angle = (i - 10) * 5; 
                card.style.transform = `rotate(${angle}deg)`;
                card.style.zIndex = i;

                // Click event to pick a card from the fan
                card.addEventListener("click", function() {
                    pickCardFromFan(this);
                });

                fanContainer.appendChild(card);
            }
        }

        // Function to shuffle the internal deck and trigger animation
        function shuffleDeck() {
            // 1. Reset everything
            pickedCards = [];
            currentDeck = [...myDeck];
            currentDeck.sort(() => Math.random() - 0.5); // Shuffle array
            
            infoTitle.innerText = "Pick 3 Cards";
            infoText.innerText = "Tap 3 cards from the fanned deck above to begin your reading.";

            // Reset the 3 slots below
            for(let i=0; i<3; i++) {
                let slot = document.getElementById(`card-${i}`);
                slot.classList.remove("is-active", "is-flipped");
                let img = document.getElementById(`img-${i}`);
                img.src = "";
                img.classList.remove("is-reversed");
            }

            // 2. Trigger the stacking animation
            createFan(); // rebuild the physical cards
            fanContainer.classList.add("is-shuffling"); // stacks them up

            // 3. Remove stacking class after 500ms so they fan back out
            setTimeout(() => {
                fanContainer.classList.remove("is-shuffling");
            }, 600);
        }
    // Function called when user taps a card in the fan
        function pickCardFromFan(clickedFanCard) {
            // Stop if they already picked 3
            if (pickedCards.length >= 3) return; 

            // Visually remove the card from the fan
            clickedFanCard.style.opacity = "0";
            clickedFanCard.style.pointerEvents = "none";

            // Pop a random card from our shuffled data deck
            const drawnData = currentDeck.pop();
            
            // 50% chance to be reversed
            const isReversed = Math.random() > 0.5;
            drawnData.drawnReversed = isReversed; // save this state

            // Add to our 3-card spread array
            pickedCards.push(drawnData);
            let slotIndex = pickedCards.length - 1;

            // Make the physical slot below appear (face down)
            let slotCard = document.getElementById(`card-${slotIndex}`);
            let slotImg = document.getElementById(`img-${slotIndex}`);
            
            slotCard.classList.add("is-active"); // Makes it visible and clickable
            
            // Pre-load the image and apply reversal if needed
            if (drawnData.image && drawnData.image !== "PASTE_YOUR_IMAGE_LINK_HERE") {
                slotImg.src = drawnData.image;
            }
            if (isReversed) {
                slotImg.classList.add("is-reversed");
            }

            // If 3 cards are picked, prompt the user
            if (pickedCards.length === 3) {
                infoTitle.innerText = "Reading Ready";
                infoText.innerText = "Tap your selected cards below to reveal them one by one.";
            }
        }

        // Logic for clicking the 3 chosen cards in the spread
        for(let i=0; i<3; i++) {
            let slotCard = document.getElementById(`card-${i}`);

                // Only flip if it hasn't been flipped yet
                if (!slotCard.classList.contains("is-flipped")) {
                    slotCard.classList.add("is-flipped");
                }
                
                // Update the text box at the bottom based on the card tapped
                let data = pickedCards[i];
                let positionLabel = i === 0 ? "Past" : i === 1 ? "Present" : "Future";
                
                if (data.drawnReversed) {
                    infoTitle.innerText = `${positionLabel}: ${data.name} (Reversed)`;
                    infoText.innerText = data.reversedExplanation || data.explanation;
                } else {
                    infoTitle.innerText = `${positionLabel}: ${data.name}`;
                    infoText.innerText = data.explanation;
                }
            });
        }

        // Connect the shuffle button
        shuffleBtn.addEventListener("click", shuffleDeck);

        // Start the app automatically on load
        shuffleDeck();

    </script>
</body>
</html>
