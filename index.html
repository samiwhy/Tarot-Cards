<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* --- CSS STYLES --- */
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #controls { margin-bottom: 30px; }

        button {
            padding: 10px 20px; margin: 0 10px; font-size: 16px;
            cursor: pointer; background-color: #e94560; color: white;
            border: none; border-radius: 5px;
        }

        .card-scene {
            width: 250px; height: 400px; perspective: 1000px;
        }

        .card {
            width: 100%; height: 100%; position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d; cursor: pointer;
        }

        .card.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); display: flex;
            flex-direction: column; justify-content: center;
            align-items: center; padding: 20px; box-sizing: border-box;
        }

        .card-back {
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            border: 2px solid #e94560;
        }

        .card-back-pattern { font-size: 60px; }

        .card-front {
            background-color: #f4f4f4; color: #333;
            transform: rotateY(180deg);
        }

        #card-title { margin-top: 0; color: #e94560; }

        #card-image {
            width: 120px; height: 180px; object-fit: cover;
            border-radius: 8px; margin-bottom: 10px;
            border: 2px solid #e94560;
        }

        .is-reversed { transform: rotate(180deg); }
    </style>
</head>

        const shuffleBtn = document.getElementById("shuffle-btn");
        const cardTitle = document.getElementById("card-title");
        const cardExplanation = document.getElementById("card-explanation");
        const tarotCard = document.getElementById("tarot-card");
        const cardImage = document.getElementById("card-image");

        function shuffleDeck() {
            currentDeck.sort(() => Math.random() - 0.5);
            cardTitle.innerText = "Deck Shuffled!";
            cardExplanation.innerText = `There are ${currentDeck.length} cards ready to be drawn.`;
            cardImage.style.display = "none"; 
        }

        function drawCard() {
            if (currentDeck.length === 0) {
                cardTitle.innerText = "Deck Empty";
                cardExplanation.innerText = "Please shuffle to play again!";
                cardImage.style.display = "none";
                return; 
            }

            const drawnCard = currentDeck.pop(); 
            const isReversed = Math.random() > 0.5;

            if (isReversed) {
                cardTitle.innerText = drawnCard.name + " (Reversed)";
                cardImage.classList.add("is-reversed"); 
                cardExplanation.innerText = "Reversed: " + (drawnCard.reversedExplanation || drawnCard.explanation);
            } else {
                cardTitle.innerText = drawnCard.name;
                cardImage.classList.remove("is-reversed"); 
                cardExplanation.innerText = drawnCard.explanation;
            }
            
            if (drawnCard.image && drawnCard.image !== "PASTE_YOUR_IMAGE_LINK_HERE") {
                cardImage.src = drawnCard.image;
                cardImage.style.display = "block";
            } else {
                cardImage.style.display = "none"; 
            }
        }

        shuffleBtn.addEventListener("click", () => {
            tarotCard.classList.remove("is-flipped"); 
            setTimeout(shuffleDeck, 300);
        });

        drawBtn.addEventListener("click", () => {
            tarotCard.classList.remove("is-flipped");
            setTimeout(() => {
                drawCard(); 
                tarotCard.classList.add("is-flipped"); 
            }, 300); 
        });

        tarotCard.addEventListener("click", () => {
            tarotCard.classList.toggle("is-flipped");
        });
